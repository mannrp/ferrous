[project]
name = "ferrous"
version = "0.1.0"
description = "High-performance RAG primitives in Rust"
requires-python = ">=3.8"
authors = [{ name = "Mann Patel" }]
dependencies = []

[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[tool.maturin]
features = ["pyo3/extension-module"]
module-name = "ferrous._ferrous"
python-source = "python"
