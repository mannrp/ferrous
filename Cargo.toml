[package]
name = "ferrous"
version = "0.3.0"
edition = "2021"
authors = ["Mann Patel"]
description = "High-performance RAG primitives in Rust"

[lib]
name = "_ferrous"
crate-type = ["cdylib", "rlib"]

[dependencies]
# PyO3 for Python bindings
pyo3 = { version = "0.27", features = ["extension-module"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Performance & Parallelism
rayon = "1.10"

# SQLite for caching
rusqlite = { version = "0.31", features = ["bundled"] }

# Markdown parsing for chunker
pulldown-cmark = "0.11"

# Hashing for fuzzy cache
murmurhash3 = "0.0.5"

# Unicode-compliant text segmentation (UAX #29)
unicode-segmentation = "1.12"

rustc-hash = "2.1.1"

# Tokenization Backends
tiktoken-rs = "0.5"
tokenizers = { version = "0.19", default-features = false, features = ["onig"] }


[dev-dependencies]
# For benchmarking
criterion = "0.5"


# For temporary file tests
tempfile = "3.19"

[workspace]
members = ["crates/ferrous-code"]
