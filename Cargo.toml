[package]
name = "ferrous"
version = "0.1.0"
edition = "2021"
authors = ["Mann Patel"]
description = "High-performance RAG primitives in Rust"

[lib]
name = "_ferrous"
crate-type = ["cdylib", "rlib"]

[dependencies]
# PyO3 for Python bindings
pyo3 = { version = "0.22", features = ["extension-module"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Performance & Parallelism
rayon = "1.10"

# SQLite for caching
rusqlite = { version = "0.31", features = ["bundled"] }

# Markdown parsing for chunker
pulldown-cmark = "0.11"

# Hashing for fuzzy cache
murmurhash3 = "0.0.5"

[dev-dependencies]
# For benchmarking
criterion = "0.5"

[[bench]]
name = "cache_bench"
harness = false
